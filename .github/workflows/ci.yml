name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test ./...
      - name: Build every target
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="dev-${GITHUB_SHA::7}"
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "dist/hum-$os-$arch$ext" .
          done
          cp deploy/hum.ps1 deploy/install-windows.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
